{% extends "base.html" %}

{% block title %}Settings — Kith Multi-Branch Pharmacy{% endblock %}

{% block content %}
<main class="page-center">
    <div class="form-card">
        <h2>System Settings</h2>
        <form method="post">
            {% csrf_token %}
            <div class="checkbox-row">
                <input type="checkbox" id="dark_mode" name="dark_mode" {% if settings_obj.dark_mode %}checked{% endif %}>
                <label for="dark_mode">Dark mode</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="email_notifications" name="email_notifications" {% if settings_obj.email_notifications %}checked{% endif %}>
                <label for="email_notifications">Receive urgent low-stock email alerts</label>
            </div>
            <button type="submit" class="btn-submit">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Save Settings
            </button>
        </form>
    </div>
</main>
{% endblock %}
