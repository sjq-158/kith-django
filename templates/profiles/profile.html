{% extends "base.html" %}

{% block title %}My Profile — Kith Multi-Branch Pharmacy{% endblock %}

{% block content %}
<main class="page-center">
    <div class="form-card">
        <h2>My Profile</h2>
        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" value="{{ profile.first_name }}" required>
            </div>
            <div class="field-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" value="{{ profile.last_name }}" required>
            </div>
            <div class="field-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" value="{{ phone }}">
            </div>
            {% if has_license %}
            <div class="field-group">
                <label for="license_number">License Number</label>
                <input type="text" name="license_number" id="license_number" value="{{ profile.license_number }}">
            </div>
            {% endif %}
            <button type="submit" class="btn-submit">
                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Save Changes
            </button>
        </form>
    </div>
</main>
{% endblock %}
