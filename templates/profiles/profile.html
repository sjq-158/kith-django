{% extends "base.html" %}

{% block title %}My Profile — Kith Multi-Branch Pharmacy{% endblock %}

{% block content %}
<main class="page-center">
    <div class="form-card">
        <h2>My Profile</h2>
        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" value="{{ profile.first_name }}" required>
            </div>
            <div class="field-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" value="{{ profile.last_name }}" required>
            </div>
            <div class="field-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" value="{{ phone }}">
            </div>
            {% if has_license %}
            <div class="field-group">
                <label for="license_number">License Number</label>
                <input type="text" name="license_number" id="license_number" value="{{ profile.license_number }}">
            </div>
            {% endif %}
            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
    </div>
</main>
{% endblock %}
